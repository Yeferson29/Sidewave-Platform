<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff7700">
  <meta name="description" content="Stream music, share moments, and connect with creators on Tunecloud.">
  <title>Tunecloud — Stream music, share moments</title>
  <meta property="og:title" content="Tunecloud — Stream music, share moments">
  <meta property="og:description" content="Stream music, share moments, and connect with creators on Tunecloud.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/logo.svg">
  <meta property="og:url" content="https://tunecloud.example.com/">
  <meta property="og:site_name" content="Tunecloud">
  <link rel="icon" href="/logo.svg">
  <link rel="stylesheet" href="/style.css">
  <style>
  :root { color-scheme: dark; }
  html { background: #121212; color: #fff; }
  body { margin: 0; min-width: 320px; background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; }
  button { color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  a { color: #ff7700; text-decoration: none; }
  a:hover { text-decoration: underline; }
  svg { width: 20px; height: 20px; flex: none; vertical-align: middle; }
  img { display: block; width: 100%; object-fit: cover; }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3, strong { letter-spacing: -0.02em; }
  h1 { font-size: 20px; font-weight: 700; }
  h2 { font-size: 16px; font-weight: 700; }
  h3 { font-size: 14px; font-weight: 600; }
  p { line-height: 1.5; }
  small { color: #aaa; font-size: 12px; }
  [hidden] { display: none !important; }
  .skip { position: fixed; z-index: 9; top: 10px; left: 10px; transform: translateY(-150%); padding: 9px 14px; background: #ff7700; color: #fff; border-radius: 6px; }
  .skip:focus { transform: none; }

  .top-nav { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: #181818; border-bottom: 1px solid #242424; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 200; }
  .top-nav .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: #fff; letter-spacing: -0.5px; }
  .top-nav .logo svg { width: 20px; height: 20px; color: #ff7700; flex: none; }
  .top-nav .search-form { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 760px; margin: 0 24px; }
  .top-nav .search-form svg { width: 16px; height: 16px; color: #888; flex: none; margin-left: 6px; }
  .top-nav .search-form input { flex: 1; min-width: 0; background: #1f1f1f; border: 1px solid #333; border-radius: 30px; padding: 6px 14px 6px 40px; color: #fff; font-size: 13px; outline: none; }
  .top-nav .search-form input::placeholder { color: #777; }
  .top-nav .search-form input:focus { border-color: #ff7700; }
  .nav-actions { display: flex; align-items: center; gap: 10px; }
  .profile-mini { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #fff; }
  .profile-mini .avatar { width: 28px; height: 28px; flex: none; }

  #content { min-height: 100dvh; padding: 64px 16px 100px 16px; }
  .stream { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start; }
  .stream-column, .stream-sidebar { min-width: 0; }

  .page-heading { margin: 0 0 16px 0; }
  .page-heading h1 { font-size: 21px; font-weight: 700; color: #fff; letter-spacing: -0.5px; margin-bottom: 2px; }
  .page-heading p { color: #aaa; font-size: 13px; }
  .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 10px 0; }
  .section-title h2 { font-size: 15px; font-weight: 700; color: #fff; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

  .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; padding: 7px 14px; cursor: pointer; background: transparent; color: #fff; }
  .button svg { width: 16px; height: 16px; flex: none; }
  .button.primary { background: #ff7700; color: #fff; }
  .button.primary:hover { background: #e66c00; }
  .button.secondary { background: #1f1f1f; color: #fff; border: 1px solid #3d3d3d; }
  .button.secondary:hover { border-color: #555; background: #2a2a2a; }
  .button.plain { color: #aaa; }
  .button.plain:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .button.text { padding: 0; color: #ff7700; border-radius: 4px; }
  .button.text:hover { background: rgba(255,119,0,0.1); }
  .button.lime { background: #ff7700; color: #fff; }
  .button.lime:hover { background: #e66c00; }
  .button.hero-link { color: #fff; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
  .button.hero-link:hover { background: rgba(255,255,255,0.15); }
  .button.icon { width: 32px; height: 32px; padding: 0; border-radius: 50%; color: #888; background: transparent; }
  .button.icon:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .button.icon.primary { color: #ff7700; background: rgba(255,119,0,0.12); }
  .button.icon.quiet { color: #888; }
  .button.icon.quiet.saved { color: #ff7700; }
  .button.danger { background: #ff4d4f; color: #fff; }
  .button.danger:hover { background: #d9363e; }
  .button.wide { width: 100%; }
  .button.compact { padding: 5px 10px; font-size: 12px; }
  .button.selected { background: #ff7700; color: #fff; }

  .avatar { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 50%; background: #ff7700; color: #fff; font-weight: 700; font-size: 13px; }
  .avatar.large { width: 72px; height: 72px; font-size: 26px; }

  .panel { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; }
  .panel.tight { padding: 10px 12px; }
  .panel > h2 { margin-bottom: 10px; font-size: 15px; font-weight: 700; }
  .empty { text-align: center; padding: 32px 16px; color: #888; border: 1px solid #2a2a2a; border-radius: 8px; background: #1a1a1a; }
  .empty .button { margin-left: auto; margin-top: 12px; }
  .empty-note { color: #888; font-size: 13px; text-align: center; padding: 16px; border: 1px dashed #333; border-radius: 8px; }
  .feature-icon { display: grid; place-items: center; border-radius: 8px; flex: none; width: 40px; height: 40px; background: #242424; color: #fff; }
  .feature-icon svg { width: 20px; height: 20px; flex: none; }
  .lilac { background: #3a2a5a; color: #c5aaff; }
  .sage { background: #2a3a3a; color: #a0c4b8; }
  .peach { background: #3a2a2a; color: #e0a080; }

  .post { display: grid; gap: 10px; }
  .post + .post { margin-top: 10px; }
  .post header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .post p { white-space: pre-wrap; overflow-wrap: anywhere; color: #fff; font-size: 14px; }

  .identity { display: flex; align-items: center; gap: 10px; color: #fff; }
  .identity:hover { text-decoration: none; }
  .identity strong { color: #fff; }
  .identity small { color: #aaa; font-size: 12px; }

  .composer .field > span { font-size: 13px; font-weight: 700; color: #ccc; }
  .field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: #ccc; }
  .field input, .field textarea, .field select { width: 100%; background: #1f1f1f; border: 1px solid #333; border-radius: 6px; color: #fff; padding: 9px 12px; font-size: 14px; outline: none; }
  .field input:focus, .field textarea:focus { border-color: #ff7700; }
  .field textarea { resize: vertical; }
  .form-end { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .muted { color: #888; font-size: 12px; }
  .info { background: #1f1f1f; color: #aaa; border: 1px solid #2a2a2a; padding: 10px 12px; border-radius: 6px; font-size: 13px; margin: 12px 0; }
  .error { color: #ff4d4f; font-size: 13px; }

  .photo-grid, .plan-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .photo-card { border: 1px solid #2a2a2a; background: #1a1a1a; border-radius: 8px; overflow: hidden; min-width: 0; }
  .photo-open { display: block; border: 0; padding: 0; background: transparent; width: 100%; }
  .photo-open img { aspect-ratio: 1.47; }
  .photo-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 10px; }
  .photo-meta strong, .photo-meta small { display: block; overflow-wrap: anywhere; }
  .photo-meta strong { font-size: 14px; color: #fff; }
  .photo-meta small { color: #888; font-size: 12px; }
  .photo-actions { display: flex; align-items: center; gap: 6px; }
  .photo-actions .icon { min-width: 32px; min-height: 32px; padding: 4px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }

  .track { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; }
  .track:hover { background: rgba(255,255,255,0.04); }
  .track > img { width: 48px; height: 48px; border-radius: 6px; flex: none; object-fit: cover; }
  .track > div { flex: 1; min-width: 0; }
  .track strong { display: block; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track small { display: block; color: #aaa; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-length { color: #888; font-size: 12px; flex: none; white-space: nowrap; }
  .compact-track { gap: 8px; padding: 8px 10px; }
  .compact-track > img { width: 36px; height: 36px; }

  .plan { border: 1px solid #2a2a2a; background: #1a1a1a; border-radius: 8px; padding: 16px; display: grid; gap: 10px; }
  .plan-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .plan ul { list-style: none; padding: 0; margin: 0; color: #ccc; font-size: 13px; }
  .plan li { display: flex; align-items: start; gap: 8px; padding: 4px 0; }
  .plan li svg { width: 15px; height: 15px; color: #ff7700; flex: none; }
  .amount { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
  .amount small { font-weight: 600; color: #aaa; letter-spacing: 0; }
  .featured-plan { border-color: #ff7700; background: rgba(255,119,0,0.08); }
  .pill { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: #ff7700; color: #fff; border-radius: 100px; font-size: 11px; font-weight: 700; padding: 2px 10px; }
  .actions.inline { margin-top: 0; }

  .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .list-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #242424; color: #fff; }
  .list-row:last-child { border-bottom: 0; }
  .list-row.identity { justify-content: flex-start; }
  .list-row .actions { margin-top: 0; }
  .list-row small { color: #888; font-size: 12px; }
  .list-row a:hover { text-decoration: underline; }

  .member-header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; }
  .member-header p { color: #aaa; font-size: 13px; }

  .explorer a { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: #fff; }
  .explorer a:hover { text-decoration: none; }
  .explorer strong { color: #fff; }
  .explorer small { color: #888; font-size: 12px; }
  .explorer h2 { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: #fff; }

  .hero { position: relative; min-height: 260px; border-radius: 10px; overflow: hidden; padding: 24px; background: linear-gradient(90deg, #141414 0%, #1e1e1e 60%, #181818 100%); color: #fffdf6; margin-bottom: 20px; }
  .hero-copy { max-width: 520px; }
  .hero-label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: #ff7700; margin-bottom: 10px; }
  .hero-label svg { width: 14px; height: 14px; flex: none; }
  .hero h1 { font-size: 34px; line-height: 1.05; letter-spacing: -0.04em; margin: 0 0 10px 0; }
  .hero p { color: #ccc; font-size: 15px; margin-bottom: 14px; }
  .hero-album { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #888; margin-top: 18px; }
  .hero-album span { color: #ff7700; }

  dialog { max-height: calc(100dvh - 30px); width: min(calc(100vw - 24px), 465px); padding: 20px; border: 1px solid #333; border-radius: 10px; color: #fff; background: #1e1e1e; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  dialog::backdrop { background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
  .dialog-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .dialog-title h2 { font-size: 18px; font-weight: 700; }
  dialog .form-end { justify-content: center; margin-top: 10px; }
  .full-photo, #upload-preview { max-height: 55dvh; object-fit: contain; background: #1a1a1a; border-radius: 8px; border: 1px solid #2a2a2a; }

  #player { position: fixed; z-index: 200; left: 0; right: 0; bottom: 0; min-height: 86px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(160px, 520px) minmax(0, 1fr); align-items: center; gap: 12px; padding: 6px 16px; border-top: 1px solid #242424; background: #181818; box-shadow: 0 -6px 30px rgba(0,0,0,0.5); }
  .now-playing, .player-buttons, .player-right, .seek { display: flex; align-items: center; gap: 8px; }
  .now-playing img { width: 44px; height: 44px; border-radius: 6px; flex: none; object-fit: cover; }
  .now-playing > div { min-width: 0; }
  .now-playing strong { display: block; font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing small { display: block; color: #888; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-buttons { justify-content: center; }
  .player-buttons .primary { min-height: 34px; background: #ff7700; border-radius: 50%; width: 34px; height: 34px; padding: 0; }
  .seek { color: #888; font-size: 11px; min-width: 0; }
  .seek input { width: 100%; min-width: 0; accent-color: #ff7700; background: transparent; border: none; }
  .player-right { justify-content: flex-end; }

  #toast { position: fixed; z-index: 200; right: 14px; bottom: 14px; max-width: calc(100% - 28px); color: #fff; background: #1e1e1e; border: 1px solid #333; padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
  .has-player #toast { bottom: 100px; }

  @media (max-width: 900px) {
    .stream { grid-template-columns: 1fr; }
    .stream-sidebar { display: none; }
    #content { padding: 64px 12px 100px 12px; }
    .top-nav .search-form { margin: 0 12px; max-width: none; }
  }
  @media (max-width: 500px) {
    .photo-grid, .plan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .settings-grid { grid-template-columns: minmax(0, 1fr); }
    .hero h1 { font-size: 26px; }
  }
  </style>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div id="layout"></div>
  <audio id="audio" preload="metadata"></audio>
  <div id="player" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
